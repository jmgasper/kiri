<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Kiri — folded-paper K</title>
  <desc>Blue and mint origami bird, adapted for Haiku. Transparent canvas,
    BeOS perspective, a one-pixel silhouette at 32 px, upper-left lighting and a rightward shadow.</desc>
  <defs>
    <linearGradient id="shadow" gradientUnits="userSpaceOnUse" x1="26" y1="54" x2="60" y2="54">
      <stop offset="0" stop-color="#222b40" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#222b40" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" gradientUnits="userSpaceOnUse" x1="14" y1="7" x2="39" y2="55">
      <stop offset="0" stop-color="#a6d3ff"/>
      <stop offset="0.45" stop-color="#64a9ed"/>
      <stop offset="1" stop-color="#3475c0"/>
    </linearGradient>
    <linearGradient id="wing" gradientUnits="userSpaceOnUse" x1="36" y1="6" x2="43" y2="33">
      <stop offset="0" stop-color="#8dc7fc"/>
      <stop offset="1" stop-color="#3d86d2"/>
    </linearGradient>
    <linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="28" y1="33" x2="47" y2="56">
      <stop offset="0" stop-color="#367dc9"/>
      <stop offset="0.75" stop-color="#24529a"/>
      <stop offset="1" stop-color="#3c68a0"/>
    </linearGradient>
    <linearGradient id="chest" gradientUnits="userSpaceOnUse" x1="12" y1="20" x2="28" y2="39">
      <stop offset="0" stop-color="#d0f2df"/>
      <stop offset="0.5" stop-color="#8bd5ca"/>
      <stop offset="1" stop-color="#5caea9"/>
    </linearGradient>
    <linearGradient id="crease" gradientUnits="userSpaceOnUse" x1="24" y1="26" x2="26" y2="40">
      <stop offset="0" stop-color="#204f94"/>
      <stop offset="1" stop-color="#153766"/>
    </linearGradient>
  </defs>

  <path id="cast-shadow" fill="url(#shadow)" d="M19 43 L27 47 L35 47 L27 43 Z M39 53 L51 59 L60 59 L48 53 Z"/>
  <!-- Front horizontal edges use 2:1 perspective; verticals stay vertical.
       The paper facets provide depth without adding a heavy block behind the mark. -->
  <g transform="matrix(0.88 0.44 0 0.68 4 -2)">
  <path id="paper-silhouette" fill="url(#paper)"
    d="M15 20.5 L15 9 C15 7.9 15.9 7 17 7 L26 7 C26.6 7 27 7.4 27 8
       L27 24 L43.4 7.6 C43.8 7.2 44.2 7 44.8 7 L54.7 7
       C55.8 7 56.1 7.7 55.4 8.6 L43.5 25.9 C43.2 26.3 42.9 26.6 42.4 26.8
       L32.1 32 L54.3 53.5 C55.1 54.3 54.6 55 53.5 55 L39.7 55
       C39.2 55 38.9 54.9 38.5 54.6 L27 45.7 L27 54 C27 54.6 26.6 55 26 55
       L17 55 C15.9 55 15 54.1 15 53 L15 25.5 L6 24 L12 20.5 Z"/>

  <!-- Broad folds carry the logo; there are no fine decorative details. -->
  <path id="lower-wing" fill="url(#tail)"
    d="M21.5 40.5 L32.1 32 L54.3 53.5 C55.1 54.3 54.6 55 53.5 55 L39.7 55
       C39.2 55 38.9 54.9 38.5 54.6 Z"/>
  <path id="fold-interior" fill="url(#crease)" d="M23.5 27.5 L27 24 L26.5 34.5 L21.5 40.5 Z"/>
  <path id="raised-wing" fill="url(#wing)"
    d="M27 24 L43.4 7.6 C43.8 7.2 44.2 7 44.8 7 L54.7 7
       C55.8 7 56.1 7.7 55.4 8.6 L43.5 25.9 C43.2 26.3 42.9 26.6 42.4 26.8
       L26.5 34.5 Z"/>
  <path id="beak" fill="#25528b" d="M6 24 L12 20.5 L15 25.5 Z"/>
  <path id="mint-chest" fill="url(#chest)" d="M12 20.5 L15 20.5 L23.5 27.5 L21.5 40.5 Z"/>
  <path id="mint-underwing" fill="#a6e3cf" d="M21.5 40.5 L26.5 34.5 L32.1 32 Z"/>

  <!-- Small filled facets suggest the thickness of folded paper. -->
  <path id="stem-top-light" fill="#d0e9fb" d="M17 7 L26 7 L26 8 L16.4 8 Z"/>
  <path id="wing-top-light" fill="#d0e9fb" d="M44.8 7 L54.7 7 L54.1 8 L43.5 8 Z"/>

  <!-- The projected stroke exports to two HVIF units: one pixel at 32 px. -->
  <path id="silhouette-outline" fill="none" stroke="#000000" stroke-width="2.55" stroke-linejoin="round"
    d="M15 20.5 L15 9 C15 7.9 15.9 7 17 7 L26 7 C26.6 7 27 7.4 27 8
       L27 24 L43.4 7.6 C43.8 7.2 44.2 7 44.8 7 L54.7 7
       C55.8 7 56.1 7.7 55.4 8.6 L43.5 25.9 C43.2 26.3 42.9 26.6 42.4 26.8
       L32.1 32 L54.3 53.5 C55.1 54.3 54.6 55 53.5 55 L39.7 55
       C39.2 55 38.9 54.9 38.5 54.6 L27 45.7 L27 54 C27 54.6 26.6 55 26 55
       L17 55 C15.9 55 15 54.1 15 53 L15 25.5 L6 24 L12 20.5 Z"/>
  </g>
</svg>
