# Builds air/OS packages (x86_64 and arm64) on every push to develop, main and publishes
# the builds of develop to the rolling "latest" release, with links in
# the README. The pipeline itself lives in jmgasper/airos-ci.
name: air/OS build

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  airos:
    uses: jmgasper/airos-ci/.github/workflows/app.yml@main
    with:
      app: kiri
      repo-dir: kiri
      publish-branch: develop
    permissions:
      contents: write
